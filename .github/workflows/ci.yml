name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: format · analyze · test · codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: |
          cd init_tasks && dart pub get
          cd ../init_tasks_builder && dart pub get
          cd ../example && dart pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: |
          cd init_tasks && dart analyze
          cd ../init_tasks_builder && dart analyze
          cd ../example && dart analyze

      - name: Run tests
        run: cd init_tasks && dart test

      - name: Verify codegen output is up to date
        run: |
          cd example
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/app_init.g.dart
